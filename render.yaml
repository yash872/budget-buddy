services:
  - type: web
    name: budget-buddy
    runtime: node
    plan: free
    # --include=dev is required because NODE_ENV=production (set below) makes
    # npm skip devDependencies by default — but `next build` itself needs
    # typescript and @tailwindcss/postcss, which live there (correctly, since
    # they're not needed at runtime by `next start`).
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: GEMMA_MODEL_NAME
        value: gemma-4-26b-a4b-it
      - key: SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: SENTRY_ORG
        sync: false
      - key: SENTRY_PROJECT
        sync: false
      - key: SENTRY_AUTH_TOKEN
        sync: false
      - key: NODE_ENV
        value: production
